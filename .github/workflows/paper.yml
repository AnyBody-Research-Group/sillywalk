name: Paper

on:
  pull_request:
    paths:
      - paper.md
      - paper.bib
      - .github/workflows/paper.yml
  push:
    paths:
      - paper.md
      - paper.bib
      - .github/workflows/paper.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  paper:
    name: Compile JOSS draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@af22ceb4b8f9eff6b3a13c05747ccc2f573cf2e6
        with:
          journal: joss
          paper-path: paper.md
      - name: Upload draft PDF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: joss-paper-draft
          path: paper.pdf
          if-no-files-found: error
          retention-days: 14
